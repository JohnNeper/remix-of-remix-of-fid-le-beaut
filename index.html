<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>BeautyFlow - Gestion Salon de Beauté</title>
  <meta name="description"
    content="Application de gestion complète pour salons de beauté : rendez-vous, clients, finances et prestations." />

  <!-- ===================== PWA Core ===================== -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#d6336c" />

  <!-- ===================== iOS / Safari ===================== -->
  <!-- Active le mode "Add to Home Screen" sur iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BeautyFlow" />
  <!-- Icône de lancement iOS (requis car Safari ignore l'entrée manifest) -->
  <link rel="apple-touch-icon" sizes="192x192" href="/pwa-icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/pwa-icon-512.png" />

  <!-- ===================== Android / Chrome ===================== -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="BeautyFlow" />

  <!-- ===================== Favicon ===================== -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="shortcut icon" href="/favicon.ico" />

  <!-- ===================== Open Graph ===================== -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="BeautyFlow - Gestion Salon de Beauté" />
  <meta property="og:description" content="Application de gestion complète pour salons de beauté." />
  <!-- IMPORTANT: Mettez votre vrai nom de domaine ici car les chemins relatifs (/image.png) ne fonctionnent pas pour les previews -->
  <meta property="og:image" content="https://beautyflowafrica.com/beautyflow-banner.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="fr_FR" />

  <!-- ===================== Twitter Card ===================== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BeautyFlow - Gestion Salon de Beauté" />
  <meta name="twitter:description" content="Application de gestion complète pour salons de beauté." />
  <meta name="twitter:image" content="https://beautyflowafrica.com/beautyflow-banner.png" />

  <!-- ===================== SEO / Robots ===================== -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="author" content="West Digital Hub" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
